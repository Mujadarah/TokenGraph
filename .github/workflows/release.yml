name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Zip entry timestamps use local calendar fields; pin UTC so a rebuild
      # on any machine reproduces the CI asset byte-for-byte.
      TZ: UTC
    defaults:
      run:
        working-directory: plugins/tokengraph
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned native-test Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup target add x86_64-unknown-linux-gnu --toolchain 1.97.1

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke test
        run: pnpm smoke -- --root . --json

      - name: Validate plugin
        run: pnpm validate:plugin

      - name: Verify release tag and package version
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node plugins/tokengraph/scripts/validate-release-version.mjs --package plugins/tokengraph/package.json --version "$VERSION"

      - name: Build release package
        run: pnpm --silent package:plugin -- --release --json > release-package.json

      - name: Build standalone release archive
        run: pnpm --silent package:plugin -- --json > bundle-package.json

      - name: Prepare release assets
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          archive=$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("bundle-package.json", "utf8")); if (!value.archivePath) throw new Error("bundle package did not report archivePath"); process.stdout.write(value.archivePath);')
          archive_base="${archive%.zip}"
          checksum="$archive.sha256"
          sbom="$archive_base.spdx.json"
          archive_bundle="$archive.sigstore.json"
          sbom_bundle="$sbom.sigstore.json"
          checksums="$archive_base.checksums.txt"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "checksums=$checksums" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"
          echo "archive_bundle=$archive_bundle" >> "$GITHUB_OUTPUT"
          echo "sbom_bundle=$sbom_bundle" >> "$GITHUB_OUTPUT"

      - name: Extract installable plugin for SBOM
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.artifact.outputs.archive }}"
          extract_dir="$RUNNER_TEMP/tokengraph-release-$GITHUB_RUN_ID"
          plugin_dir="$extract_dir/tokengraph"
          mkdir -p "$extract_dir"
          unzip -q "$archive" -d "$extract_dir"
          test -f "$plugin_dir/.codex-plugin/plugin.json"
          test -f "$plugin_dir/package.json"
          test ! -e "$plugin_dir/node_modules"
          echo "plugin_dir=$plugin_dir" >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ steps.extract.outputs.plugin_dir }}
          format: spdx-json
          output-file: ${{ steps.artifact.outputs.sbom }}
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign release assets
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.artifact.outputs.archive }}"
          sbom="${{ steps.artifact.outputs.sbom }}"
          archive_bundle="${{ steps.artifact.outputs.archive_bundle }}"
          sbom_bundle="${{ steps.artifact.outputs.sbom_bundle }}"
          test -s "$archive"
          test -s "$sbom"
          cosign sign-blob --yes --bundle "$archive_bundle" "$archive"
          cosign sign-blob --yes --bundle "$sbom_bundle" "$sbom"

      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.artifact.outputs.archive }}"
          sbom="${{ steps.artifact.outputs.sbom }}"
          archive_bundle="${{ steps.artifact.outputs.archive_bundle }}"
          sbom_bundle="${{ steps.artifact.outputs.sbom_bundle }}"
          workflow_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign verify-blob "$archive" --bundle "$archive_bundle" --certificate-identity "$workflow_identity" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          cosign verify-blob "$sbom" --bundle "$sbom_bundle" --certificate-identity "$workflow_identity" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.artifact.outputs.archive }}"
          checksum="${{ steps.artifact.outputs.checksum }}"
          checksums="${{ steps.artifact.outputs.checksums }}"
          sbom="${{ steps.artifact.outputs.sbom }}"
          archive_bundle="${{ steps.artifact.outputs.archive_bundle }}"
          sbom_bundle="${{ steps.artifact.outputs.sbom_bundle }}"
          # Checksums use bare names so users can verify downloaded assets
          # without exposing CI runner paths in a public release asset.
          (cd "$(dirname "$archive")" && sha256sum "$(basename "$archive")" > "$(basename "$checksum")")
          (cd "$(dirname "$archive")" && sha256sum "$(basename "$archive")" "$(basename "$sbom")" "$(basename "$archive_bundle")" "$(basename "$sbom_bundle")" > "$(basename "$checksums")")
          (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$checksum")" && sha256sum -c "$(basename "$checksums")")
          cat "$checksum"
          cat "$checksums"

      - name: Create GitHub build provenance attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.artifact.outputs.archive }}

      - name: Create GitHub SBOM attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.artifact.outputs.archive }}
          sbom-path: ${{ steps.artifact.outputs.sbom }}

      - name: Build and validate draft release notes
        working-directory: .
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Historical corrections remain append-only in CHANGELOG.md; draft
          # release notes are rendered only from the canonical contract.
          node plugins/tokengraph/scripts/render-release-notes.mjs --version "$VERSION" > release-notes.md
          node plugins/tokengraph/scripts/validate-release-notes.mjs --file release-notes.md --version "$VERSION"

      # The release is created as a DRAFT on purpose: a maintainer reviews the
      # asset and gate evidence, then clicks Publish. Do not forget that final
      # step - until it happens, users installing from the latest release get
      # the previous version.
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        working-directory: .
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "TokenGraph $TAG_NAME" \
            --notes-file release-notes.md \
            "${{ steps.artifact.outputs.archive }}" \
            "${{ steps.artifact.outputs.checksum }}" \
            "${{ steps.artifact.outputs.checksums }}" \
            "${{ steps.artifact.outputs.sbom }}" \
            "${{ steps.artifact.outputs.archive_bundle }}" \
            "${{ steps.artifact.outputs.sbom_bundle }}"
