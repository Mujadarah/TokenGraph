name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/tokengraph
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugins/tokengraph/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned native-test Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup target add x86_64-unknown-linux-gnu --toolchain 1.97.1

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke test
        run: pnpm smoke -- --root . --json

      - name: Validate plugin
        run: pnpm validate:plugin

      - name: Build standalone marketplace archive
        run: pnpm package:plugin -- --json

      - name: Scan tracked source and documentation for non-ASCII characters
        working-directory: .
        shell: bash
        run: |
          files=$(git ls-files -z | tr '\0' '\n' | grep -v '^release/tokengraph/dist/' || true)
          if [ -n "$files" ]; then
            bad=$(printf '%s\n' "$files" | xargs -r grep -Il '[^ -~]' || true)
            if [ -n "$bad" ]; then
              echo "Non-ASCII characters found in:" >&2
              printf '%s\n' "$bad" >&2
              exit 1
            fi
          fi

      - name: Rebuild committed release
        run: pnpm package:plugin -- --release

      - name: Confirm committed release is reproducible
        working-directory: .
        run: git diff --exit-code -- release/tokengraph

      - name: Validate Claude plugin strictly when CLI is available
        working-directory: .
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
            claude plugin validate ./release/tokengraph
          else
            echo "Claude CLI not installed on this runner; manifest checks remain covered by pnpm validate:plugin."
          fi
